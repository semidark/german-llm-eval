[project]
name = "german-llm-eval"
version = "0.1.0"
description = "API-based LLM evaluator using SuperGLEBer German benchmark datasets"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pyarrow",
    "openai>=1.0.0",
    "rich",
    "tqdm",
    "datasets>=4.8.5",
]

[project.scripts]
german-llm-eval = "german_llm_eval.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
markers = ["unit", "integration"]
